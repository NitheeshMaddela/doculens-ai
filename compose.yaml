name: doculens
x-backend: &backend
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://doculens:${POSTGRES_PASSWORD:-doculens-local}@db:5432/doculens
    STORAGE_PATH: /data
    QUERY_PER_MINUTE: ${QUERY_PER_MINUTE:-12}
  volumes:
    - pdfs:/data
services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: doculens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doculens-local}
      POSTGRES_DB: doculens
    volumes:
      - postgres:/var/lib/postgresql/data
    ports: ["127.0.0.1:${DB_PORT:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doculens -d doculens"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
volumes:
  postgres:
  pdfs:
